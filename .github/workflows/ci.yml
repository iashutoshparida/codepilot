name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Tests with coverage
        run: |
          coverage run -m pytest
          coverage report --fail-under=85

  evaluation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Evaluate on the sample legacy repository
        run: |
          codepilot evaluate examples/inventory_app --tests tests \
            --bugs examples/inventory_app/bugs.json --markdown evaluation.md --json evaluation.json
      - name: Check results did not regress
        run: |
          python - <<'PY'
          import json
          r = json.load(open("evaluation.json"))["with_generated"]
          assert r["mutation"]["score"] >= 80, r["mutation"]["score"]
          assert r["bug_injection"]["detected"] >= 9, r["bug_injection"]
          print("mutation score", r["mutation"]["score"], "bugs", r["bug_injection"]["detected"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: evaluation.md

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip install -e .
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codepilot:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name cp -p 8000:8000 -e CODEPILOT_API_KEY=ci-key codepilot:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/v1/analysis \
                 -H 'Content-Type: application/json' -d '{"repo_path":"/workspace"}')" = "401"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot"
version = "0.1.0"
description = "Repository analysis, change-impact and validated test generation for Python codebases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashutosh Parida" }]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "networkx>=3.2",
  "httpx>=0.27",
  "coverage>=7.4",
  "pytest>=8.0",
  "hypothesis>=6.100",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "uvicorn>=0.29"]

[project.scripts]
codepilot = "codepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/codepilot"]

[tool.coverage.run]
branch = true
source = ["codepilot"]
